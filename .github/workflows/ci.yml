name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Verify local D1
        run: npm run db:verify:local

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify Workers build output
        run: test -f dist/server/wrangler.json

      - name: Smoke-test Workers runtime + D1
        shell: bash
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 8787 --persist-to .wrangler/state > /tmp/needle-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8787/api/health); then
              echo "$response"
              echo "$response" | grep '"status":"ok"'
              echo "$response" | grep '"database":"ok"'
              exit 0
            fi
            sleep 1
          done

          echo "Workers preview did not become healthy."
          cat /tmp/needle-wrangler.log
          exit 1

      - name: Commit generated npm lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/1.00-cloudflare-scaffold'
        shell: bash
        run: |
          if git ls-tree -r --name-only "${{ github.event.pull_request.head.sha }}" | grep -qx 'package-lock.json'; then
            echo "package-lock.json is already tracked."
            exit 0
          fi

          git fetch origin "${{ github.head_ref }}"
          git switch -C "${{ github.head_ref }}" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock scaffold dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
