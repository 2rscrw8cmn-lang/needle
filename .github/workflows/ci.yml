name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Verify local D1
        run: npm run db:verify:local

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify album resolution CLI parses
        run: npm run history:resolve-albums -- --help

      - name: Verify Spotify enrichment CLI parses
        run: npm run history:enrich-albums -- --help

      - name: Verify Music Type taxonomy CLI parses
        run: npm run history:classify-music-types -- --help

      - name: Verify archive reconciliation CLI parses
        run: npm run history:reconcile -- --help

      - name: Verify cached archive preview CLI parses
        run: npm run history:preview-cached -- --help

      - name: Validate sanitized history fixture
        run: |
          npm run history:validate -- \
            --input fixtures/history \
            --output /tmp/needle-history-validation \
            --as-of 2026-08-25T23:59:59Z
          test -f /tmp/needle-history-validation/import-manifest.json
          test -f /tmp/needle-history-validation/import-report.json
          test -f /tmp/needle-history-validation/import-report.md
          test -f /tmp/needle-history-validation/validated-music.json
          test -f /tmp/needle-history-validation/quarantine.json

      - name: Normalize sanitized playback events
        run: |
          npm run history:normalize -- --input /tmp/needle-history-validation
          test -f /tmp/needle-history-validation/normalized-playback-events.json
          test -f /tmp/needle-history-validation/normalization-report.json
          test -f /tmp/needle-history-validation/normalization-report.md
          node -e "const r=require('/tmp/needle-history-validation/normalization-report.json'); if(!r.ok || !r.reconciliation.matchesValidationReport || !r.reconciliation.balances) process.exit(1)"

      - name: Reconstruct sanitized album sessions
        run: |
          npm run history:sessionize -- --input /tmp/needle-history-validation
          test -f /tmp/needle-history-validation/album-sessions.json
          test -f /tmp/needle-history-validation/provisional-albums.json
          test -f /tmp/needle-history-validation/sessionization-report.json
          test -f /tmp/needle-history-validation/sessionization-report.md
          node -e "const r=require('/tmp/needle-history-validation/sessionization-report.json'); if(!r.ok || !r.reconciliation.matchesNormalizationReport || !r.reconciliation.positiveEventsBalance || !r.reconciliation.zeroMsEventsBalance) process.exit(1)"

      - name: Build
        run: npm run build

      - name: Verify Workers build output
        run: test -f dist/server/wrangler.json

      - name: Smoke-test Workers runtime + D1
        shell: bash
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 8787 --persist-to .wrangler/state > /tmp/needle-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8787/api/health); then
              echo "$response"
              echo "$response" | grep '"status":"ok"'
              echo "$response" | grep '"database":"ok"'
              exit 0
            fi
            sleep 1
          done

          echo "Workers preview did not become healthy."
          cat /tmp/needle-wrangler.log
          exit 1
